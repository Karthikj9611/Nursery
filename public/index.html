.login-container {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  padding:40px;
  border-radius:20px;
  width:320px;
  box-shadow:0 15px 35px rgba(0,0,0,0.3);
  text-align:center;
  color:#fff;
}

h2 { margin-bottom:20px; }

.error-box {
  display:none;
  background: rgba(255,75,92,0.2);
  color:#ffccd5;
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
}

.input-group { margin-bottom:20px; }

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background: rgba(255,255,255,0.2);
  color:#fff;
}

input::placeholder { color:#ddd; }

button {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background: linear-gradient(135deg, #22c55e, #16a34a); /* 🌿 green theme */
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  transform: scale(1.05);
}

a {
  color:#bbf7d0;
  text-decoration:none;
}

a:hover { text-decoration:underline; }
</style>
</head>

<body>

<div class="login-container">
  <h2>Enter Username/Mobile No. 👋</h2>

  <div id="errorBox" class="error-box"></div>

  <form id="loginForm">
    <div class="input-group">
      <input type="text" name="username" placeholder="Username">
    </div>

    <div class="input-group">
      <input type="tel" name="phone" pattern="[0-9]{10}" placeholder="Mobile No.">
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <button type="submit">Login</button>
  </form>

  <p>New user? <a href="register.html">Create Account</a></p>
</div>

<script>
const errorBox = document.getElementById("errorBox");

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const data = new URLSearchParams(new FormData(e.target));
  const res = await fetch("/login", { method:"POST", body:data });
  const text = await res.text();

  if(text.includes("❌")){
    errorBox.style.display="block";
    errorBox.innerText=text;
  } else {
    window.location.href="/dashboard";
  }
});
</script>

</body>
</html>
